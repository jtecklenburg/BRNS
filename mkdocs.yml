site_name: BRNS
site_description: "Biogeochemical Reaction Network Simulator"

theme:
    name: "material"
    palette:
        primary: "cyan"
        accent: "grey"

plugins:
    - search
    - mkdocstrings:
        default_handler: python
    - mkdocs-jupyter:
        execute: true

markdown_extensions:
    - pymdownx.highlight
    - pymdownx.superfences

nav:
    - "Start": index.md
    - "Literature": references.md
    - "acg": api_acg.md
    - "gaussian_elimination": api_gaussian_elimination.md
    - "acg_orchestrator": api_acg_orchestrator.md