name: Test Installation Guides

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-wsl-guide:
    name: Linux / WSL guide
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Fortran compiler and linear algebra libraries
        run: |
          sudo apt update
          sudo apt install -y gfortran liblapack-dev libblas-dev
          gfortran --version

      - name: Create and activate virtual environment
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install "macrofor @ git+https://github.com/jtecklenburg/macrofor.git"
          python -m pip install -e .
          python -m pip install notebook jupyter nbconvert matplotlib

      - name: Run the minimal example
        run: |
          . .venv/bin/activate
          chmod +x ./build_python.sh
          ./build_python.sh -c ./models/single_species/single_species_example.yaml -i ./models/single_species

      - name: Execute result notebook
        env:
          BRNS_RESULT_LABEL: Linux / WSL
        run: |
          . .venv/bin/activate
          export BRNS_RESULT_DIR="$PWD/build_output/single_species_example/results"
          jupyter nbconvert --to notebook --execute --ExecutePreprocessor.timeout=120 --output executed_plot_results.ipynb notebooks/plot_results.ipynb

      - name: Validate BRNS output against reference
        shell: bash
        env:
          BRNS_RESULT_DIR: ${{ github.workspace }}/build_output/single_species_example/results
          BRNS_REFERENCE_DIR: ${{ github.workspace }}/tests/reference/single_species
        run: |
          set -euo pipefail
          python3 - "$BRNS_RESULT_DIR" "$BRNS_REFERENCE_DIR" <<'PY'
          import sys
          from pathlib import Path

          import numpy as np

          def load_numeric(path: Path):
              try:
                  return np.loadtxt(path)
              except Exception:
                  try:
                      return np.loadtxt(path, skiprows=1)
                  except Exception as exc:
                      raise ValueError(f"Could not parse numeric data from {path}: {exc}") from exc

          result_dir = Path(sys.argv[1])
          reference_dir = Path(sys.argv[2])

          if not result_dir.exists():
              raise SystemExit(f"ERROR: Result directory not found: {result_dir}")

          result_files = sorted(p for p in result_dir.iterdir() if p.is_file())
          if not result_files:
              raise SystemExit(f"ERROR: No generated BRNS result files found in {result_dir}")

          ref_files = sorted(p for p in reference_dir.iterdir() if p.is_file())
          if not ref_files:
              raise SystemExit(f"ERROR: Reference directory is empty or missing: {reference_dir}")

          missing = []
          mismatches = []

          for ref_path in ref_files:
              target = result_dir / ref_path.name
              if not target.exists():
                  missing.append(ref_path.name)
                  continue

              try:
                  ref_data = load_numeric(ref_path)
                  res_data = load_numeric(target)
              except ValueError as exc:
                  raise SystemExit(f"ERROR: {exc}") from exc

              if ref_data.shape != res_data.shape:
                  mismatches.append((ref_path.name, "shape mismatch", None))
                  continue

              diff = np.abs(ref_data - res_data)
              rel = diff / (np.abs(ref_data) + 1e-15)
              max_rel = float(np.max(rel)) if rel.size else 0.0

              if not np.allclose(ref_data, res_data, rtol=1e-8, atol=1e-12):
                  mismatches.append((ref_path.name, "values differ", max_rel))

          if missing:
              print("ERROR: Missing generated files compared to reference:")
              for name in missing:
                  print(f"  - {name}")
              raise SystemExit(1)

          if mismatches:
              print("ERROR: Generated files differ from the reference data in tests/reference/single_species:")
              for name, reason, max_rel in mismatches:
                  if max_rel is None:
                      print(f"  - {name}: {reason}")
                  else:
                      print(f"  - {name}: {reason} (max relative error: {max_rel:.2e})")
              raise SystemExit(1)

          print(f"OK: All {len(ref_files)} reference files match the BRNS output in {result_dir}")
          PY

      - name: Upload executed notebook
        uses: actions/upload-artifact@v4
        with:
          name: executed-plot-results-linux-wsl
          path: notebooks/executed_plot_results.ipynb
          if-no-files-found: error

  windows-guide:
    name: Windows guide
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up MSYS2 Fortran toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-gcc-fortran
            mingw-w64-x86_64-lapack

      - name: Create and activate virtual environment
        shell: msys2 {0}
        env:
          PYTHONUTF8: "1"
        run: |
          PYTHON_EXE="$(cygpath -u "$pythonLocation")/python.exe"
          "$PYTHON_EXE" -m venv .venv
          . .venv/Scripts/activate
          python -m pip install --upgrade pip
          python -m pip install "macrofor @ git+https://github.com/jtecklenburg/macrofor.git"
          python -m pip install -e .
          python -m pip install notebook jupyter nbconvert matplotlib
          mkdir -p .ci-bin
          cat > .ci-bin/python3 <<'EOF'
          #!/usr/bin/env bash
          "$(dirname "$0")/../.venv/Scripts/python.exe" "$@"
          EOF
          chmod +x .ci-bin/python3
          printf '%s\n' "$PWD/.ci-bin" >> "$GITHUB_PATH"
          gfortran --version

      - name: Run the minimal example
        shell: msys2 {0}
        env:
          PYTHONUTF8: "1"
        run: |
          . .venv/Scripts/activate
          export PATH="$PWD/.ci-bin:$PATH"
          ./build_python.sh -c ./models/single_species/single_species_example.yaml -i ./models/single_species

      - name: Execute result notebook
        shell: msys2 {0}
        env:
          PYTHONUTF8: "1"
          BRNS_RESULT_LABEL: Windows
        run: |
          . .venv/Scripts/activate
          export PATH="$PWD/.ci-bin:$PATH"
          export BRNS_RESULT_DIR="$(cygpath -w "$PWD")\\build_output\\single_species_example\\results"
          jupyter nbconvert --to notebook --execute --ExecutePreprocessor.timeout=120 --output executed_plot_results.ipynb notebooks/plot_results.ipynb

      - name: Validate BRNS output against reference
        shell: msys2 {0}
        env:
          PYTHONUTF8: "1"
          BRNS_RESULT_DIR: ${{ github.workspace }}/build_output/single_species_example/results
          BRNS_REFERENCE_DIR: ${{ github.workspace }}/tests/reference/single_species
        run: |
          set -euo pipefail
          python - "$BRNS_RESULT_DIR" "$BRNS_REFERENCE_DIR" <<'PY'
          import sys
          from pathlib import Path

          import numpy as np

          def load_numeric(path: Path):
              try:
                  return np.loadtxt(path)
              except Exception:
                  try:
                      return np.loadtxt(path, skiprows=1)
                  except Exception as exc:
                      raise ValueError(f"Could not parse numeric data from {path}: {exc}") from exc

          result_dir = Path(sys.argv[1])
          reference_dir = Path(sys.argv[2])

          if not result_dir.exists():
              raise SystemExit(f"ERROR: Result directory not found: {result_dir}")

          result_files = sorted(p for p in result_dir.iterdir() if p.is_file())
          if not result_files:
              raise SystemExit(f"ERROR: No generated BRNS result files found in {result_dir}")

          ref_files = sorted(p for p in reference_dir.iterdir() if p.is_file())
          if not ref_files:
              raise SystemExit(f"ERROR: Reference directory is empty or missing: {reference_dir}")

          missing = []
          mismatches = []

          for ref_path in ref_files:
              target = result_dir / ref_path.name
              if not target.exists():
                  missing.append(ref_path.name)
                  continue

              try:
                  ref_data = load_numeric(ref_path)
                  res_data = load_numeric(target)
              except ValueError as exc:
                  raise SystemExit(f"ERROR: {exc}") from exc

              if ref_data.shape != res_data.shape:
                  mismatches.append((ref_path.name, "shape mismatch", None))
                  continue

              diff = np.abs(ref_data - res_data)
              rel = diff / (np.abs(ref_data) + 1e-15)
              max_rel = float(np.max(rel)) if rel.size else 0.0

              if not np.allclose(ref_data, res_data, rtol=1e-8, atol=1e-12):
                  mismatches.append((ref_path.name, "values differ", max_rel))

          if missing:
              print("ERROR: Missing generated files compared to reference:")
              for name in missing:
                  print(f"  - {name}")
              raise SystemExit(1)

          if mismatches:
              print("ERROR: Generated files differ from the reference data in tests/reference/single_species:")
              for name, reason, max_rel in mismatches:
                  if max_rel is None:
                      print(f"  - {name}: {reason}")
                  else:
                      print(f"  - {name}: {reason} (max relative error: {max_rel:.2e})")
              raise SystemExit(1)

          print(f"OK: All {len(ref_files)} reference files match the BRNS output in {result_dir}")
          PY

      - name: Upload executed notebook
        uses: actions/upload-artifact@v4
        with:
          name: executed-plot-results-windows
          path: notebooks/executed_plot_results.ipynb
          if-no-files-found: error